<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <script src="chart.js" defer></script>
</head>
<body>

    <header class="main-header">
        <h1>Max Temp</h1>
    </header>

    <div class="content-wrapper">
        <div>What city are you in?</div>
        <div class="form-container-slider">
            <form id="city-form" class="form-container">
                    <input autocomplete="off" autofocus name="name" placeholder="City" type="text" id="get-city">
                    <input autocomplete="off" autofocus name="name" placeholder="Country" type="text" id="get-country">
                    <button type="submit">Go!</button>
            </form>
            
            <div class="degrees">
                <label class="switch">
                    <input type="checkbox" id="degrees-checked" checked>
                    <span class="slider round"></span>
                </label>
                <div>°C</div>
            </div>
        </div>
        <div id="city-country"></div>
        <canvas id="lineChart" width="600" height="400"></canvas>
    </div>
    
</body>
</html>
